<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>SINAL — Editor de Fotos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0B0D12">
<link rel="stylesheet" href="style.css">
<style>
  .editor-wrap {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 20px;
  }

  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(11,13,18,0.88);
    backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .editor-titulo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
  }

  .editor-voltar {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
  }

  .editor-preview {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 300px;
    position: relative;
  }

  .editor-preview canvas {
    max-width: 100%;
    max-height: 60vh;
    border-radius: 12px;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.8);
    display: block;
  }

  .editor-preview-vazio {
    text-align: center;
    color: var(--text-faint);
    padding: 60px 20px;
  }

  .editor-preview-vazio svg {
    margin: 0 auto 16px;
    display: block;
    opacity: 0.5;
  }

  .editor-preview-vazio p {
    font-size: 14px;
    margin-bottom: 20px;
  }

  .btn-escolher-foto {
    background: linear-gradient(135deg, #FFC454, var(--amber));
    color: #17130A;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 20px -6px rgba(255,176,32,0.5);
  }

  .editor-painel {
    padding: 0 20px;
  }

  .editor-secao-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 10px;
    margin-top: 16px;
  }

  .editor-presets {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .editor-presets::-webkit-scrollbar { display: none; }

  .editor-preset {
    flex-shrink: 0;
    width: 88px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .editor-preset.ativo {
    border-color: var(--amber);
    box-shadow: 0 0 0 2px rgba(255,176,32,0.3);
  }

  .editor-preset-thumb {
    width: 100%;
    height: 88px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    font-size: 24px;
    overflow: hidden;
  }

  .editor-preset-thumb canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .editor-preset-nome {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    padding: 8px 6px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .editor-preset.ativo .editor-preset-nome {
    color: var(--amber);
  }

  .editor-slider-wrap {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  .editor-slider-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .editor-slider-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .editor-slider-valor {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--amber);
    font-weight: 700;
  }

  .editor-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 4px;
    background: var(--border);
    outline: none;
  }

  .editor-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFC454, var(--amber));
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(255,176,32,0.5);
    border: 2px solid #17130A;
  }

  .editor-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFC454, var(--amber));
    cursor: pointer;
    border: 2px solid #17130A;
    box-shadow: 0 2px 8px rgba(255,176,32,0.5);
  }

  .editor-acoes {
    display: flex;
    gap: 10px;
    padding: 0 20px;
    margin-top: 8px;
  }

  .editor-acoes .btn {
    flex: 1;
    padding: 14px;
    justify-content: center;
    font-size: 14px;
  }

  .editor-baixar {
    background: linear-gradient(135deg, #FFC454, var(--amber));
    border-color: var(--amber);
    color: #17130A;
    font-weight: 700;
    box-shadow: 0 8px 20px -6px rgba(255,176,32,0.5);
  }

  .editor-status {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    padding: 10px;
  }

  .editor-loading {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--text-dim);
    font-size: 14px;
  }

  .editor-loading.hidden { display: none; }

  .editor-spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: girar 0.8s linear infinite;
  }

  @keyframes girar { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="editor-wrap">

  <div class="editor-header">
    <a href="dashboard.html" class="editor-voltar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <div class="editor-titulo">Editor de Fotos</div>
    <div style="width:36px;"></div>
  </div>

  <div class="editor-preview" id="editorPreview">
    <div class="editor-preview-vazio" id="editorVazio">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <p>Escolha uma foto pra começar</p>
      <button class="btn-escolher-foto" id="btnEscolherFoto">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Escolher foto
      </button>
    </div>
    <canvas id="canvasEditor" style="display:none;"></canvas>
  </div>

  <div class="editor-painel" id="editorPainel" style="display:none;">
    <div class="editor-secao-label">Preset</div>
    <div class="editor-presets" id="listaPresets"></div>

    <div class="editor-secao-label">Intensidade</div>
    <div class="editor-slider-wrap">
      <div class="editor-slider-topo">
        <span class="editor-slider-label">Força do preset</span>
        <span class="editor-slider-valor" id="intensidadeValor">100%</span>
      </div>
      <input type="range" class="editor-slider" id="intensidadeSlider" min="0" max="100" value="100">
    </div>

    <div class="editor-status" id="editorStatus"></div>
  </div>

  <div class="editor-acoes" id="editorAcoes" style="display:none;">
    <button class="btn" id="btnTrocarFoto">Trocar foto</button>
    <button class="btn editor-baixar" id="btnBaixar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      Baixar
    </button>
  </div>

</div>

<input type="file" id="fileInput" accept="image/*" style="display:none;">

<div class="editor-loading hidden" id="editorLoading">
  <div class="editor-spinner"></div>
  <span id="editorLoadingTexto">Carregando...</span>
</div>

<script type="module" src="editor.js"></script>
</body>
</html>
