<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINAL — Agenda</title>
<meta name="description" content="Programação completa da igreja">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#08090D">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #08090D;
  --surface: #12151C;
  --border: #1E2330;
  --text: #F0F1F4;
  --muted: #8B92A8;
  --faint: #3D4558;
  --amber: #FFB020;
  --green: #2EE896;
  --red: #FF5C5C;
  --radius: 16px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse 60% 40% at 80% -10%, rgba(255,176,32,0.08), transparent),
    radial-gradient(ellipse 40% 40% at 10% 100%, rgba(46,232,150,0.05), transparent);
}

.shell { max-width: 540px; margin: 0 auto; padding: 40px 20px 80px; }

.topo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }

.anel {
  width: 38px; height: 38px; border-radius: 50%;
  background: conic-gradient(from 180deg, #2EE896, #FFB020, #FF5C5C, #2EE896);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.anel::after {
  content: ''; width: 24px; height: 24px;
  border-radius: 50%; background: var(--bg);
}

.topo-info h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.3px;
}
.topo-info p { font-size: 13px; color: var(--muted); margin-top: 2px; }

.insta-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,176,32,0.08);
  border: 1px solid rgba(255,176,32,0.2);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--amber);
  text-decoration: none;
  margin-bottom: 32px;
  transition: background 0.15s;
}
.insta-link:hover { background: rgba(255,176,32,0.14); }

.secao-titulo {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.secao-titulo::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.item-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 10px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
  animation: entrar 0.3s ease backwards;
}

@keyframes entrar {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.item-card.destaque {
  border-color: rgba(255,92,92,0.35);
  background: linear-gradient(180deg, rgba(255,92,92,0.04), var(--surface));
}

.item-badge {
  flex-shrink: 0;
  text-align: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 8px;
  min-width: 52px;
}
.item-badge-dia {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 24px;
  line-height: 1;
}
.item-badge-mes {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-top: 3px;
}
.item-badge.hoje { border-color: rgba(255,92,92,0.4); }
.item-badge.hoje .item-badge-dia { color: var(--red); }
.item-badge.breve { border-color: rgba(255,176,32,0.3); }
.item-badge.breve .item-badge-dia { color: var(--amber); }
.item-badge.evento { border-color: rgba(124,58,237,0.3); background: rgba(124,58,237,0.05); }
.item-badge.evento .item-badge-dia { color: #A78BFA; }

.item-corpo { flex: 1; min-width: 0; }

.item-tag {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 6px;
}
.item-tag.evento { color: #A78BFA; }

.item-titulo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 18px;
  margin-bottom: 4px;
  line-height: 1.2;
}

.item-sub {
  font-size: 13.5px;
  color: var(--muted);
  margin-bottom: 6px;
  line-height: 1.4;
}

.item-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.item-meta span {
  font-size: 12px;
  color: var(--faint);
  display: flex;
  align-items: center;
  gap: 4px;
}

.item-banner {
  width: 100%;
  border-radius: 12px;
  margin-top: 12px;
  max-height: 200px;
  object-fit: cover;
  border: 1px solid var(--border);
}

.item-dia-semana {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 3px 9px;
  border-radius: 20px;
  flex-shrink: 0;
  margin-top: 2px;
  white-space: nowrap;
}
.item-dia-semana.hoje { background: rgba(255,92,92,0.12); color: var(--red); }
.item-dia-semana.normal { background: rgba(255,255,255,0.04); color: var(--faint); }

.vazio {
  text-align: center;
  padding: 40px 20px;
  color: var(--faint);
  font-size: 14px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

@keyframes shimmer {
  0% { background-position: -300% 0; }
  100% { background-position: 300% 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, #1a1d26 50%, var(--surface) 75%);
  background-size: 300% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.skeleton-item { height: 90px; margin-bottom: 10px; }

.rodape {
  margin-top: 48px;
  text-align: center;
  font-size: 12px;
  color: var(--faint);
  line-height: 1.8;
}

</style>
</head>
<body>

<div class="shell">

  <div class="topo">
    <div class="anel"></div>
    <div class="topo-info">
      <h1 id="nomeIgreja">SINAL</h1>
      <p>Programação da igreja</p>
    </div>
  </div>

  <a href="https://instagram.com/ieadrn.pv" target="_blank" class="insta-link" id="instaLink">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
    <span id="instaTexto">@ieadrn.pv</span>
  </a>

  <div class="secao-titulo">Próximos</div>
  <div id="listaAgenda">
    <div class="skeleton skeleton-item"></div>
    <div class="skeleton skeleton-item"></div>
    <div class="skeleton skeleton-item"></div>
  </div>

  <div class="rodape">
    Gerenciado com <strong style="color:var(--amber);">SINAL</strong> · Sistema de mídia para igrejas
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const MESES_ABREV = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
const DIAS_COMPLETO = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

function escapeHtml(t) {
  if (!t) return "";
  const d = document.createElement("div");
  d.textContent = t;
  return d.innerHTML;
}

// Config da igreja
async function carregarConfig() {
  try {
    const snap = await getDoc(doc(db, "configuracoes", "app"));
    if (snap.exists()) {
      const c = snap.data();
      if (c.nomeIgreja) document.getElementById("nomeIgreja").textContent = c.nomeIgreja;

      // Instagram — procura na string de links (ex: "Instagram: instagram.com/nome")
      if (c.links) {
        const match = c.links.match(/instagram\.com\/([a-zA-Z0-9_.]+)/i);
        if (match) {
          const handle = match[1];
          document.getElementById("instaLink").href = `https://instagram.com/${handle}`;
          document.getElementById("instaTexto").textContent = `@${handle}`;
        }
      }
    }
  } catch(e) {}
}
carregarConfig();

// Agenda
const hoje0h = new Date(); hoje0h.setHours(0,0,0,0);

const qAgenda = query(
  collection(db, "agenda"),
  orderBy("data", "asc")
);

onSnapshot(qAgenda, (snap) => {
  const container = document.getElementById("listaAgenda");

  // Filtra só do dia de hoje pra frente
  const itens = snap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .filter((item) => {
      if (!item.data) return false;
      const d = item.data.toDate();
      return d >= hoje0h;
    });

  if (itens.length === 0) {
    container.innerHTML = `<div class="vazio">Nenhum evento cadastrado por enquanto.</div>`;
    return;
  }

  container.innerHTML = itens.map((item, i) => {
    const dt = item.data.toDate();
    const alvo = new Date(dt); alvo.setHours(0,0,0,0);
    const diffDias = Math.round((alvo - hoje0h) / 86400000);
    const ehHoje = diffDias === 0;
    const ehBreve = diffDias > 0 && diffDias <= 3;
    const ehEvento = item.tipo === "evento";

    const dia = String(dt.getDate()).padStart(2,"0");
    const mes = MESES_ABREV[dt.getMonth()];
    const diaSemana = DIAS_COMPLETO[dt.getDay()];

    return `
      <div class="item-card ${ehHoje ? "destaque" : ""}" style="animation-delay:${i*0.05}s">
        <div class="item-badge ${ehHoje ? "hoje" : ehBreve ? "breve" : ""} ${ehEvento ? "evento" : ""}">
          <div class="item-badge-dia">${dia}</div>
          <div class="item-badge-mes">${mes}</div>
        </div>
        <div class="item-corpo">
          ${ehEvento ? `<div class="item-tag evento">Evento especial</div>` : ""}
          <div class="item-titulo">${escapeHtml(item.titulo)}</div>
          ${item.descricao ? `<div class="item-sub">${escapeHtml(item.descricao)}</div>` : ""}
          <div class="item-meta">
            ${item.horario ? `<span>🕐 ${escapeHtml(item.horario)}</span>` : ""}
            ${item.local ? `<span>📍 ${escapeHtml(item.local)}</span>` : ""}
            ${item.pregador ? `<span>🎤 ${escapeHtml(item.pregador)}</span>` : ""}
          </div>
          ${item.banner ? `<img class="item-banner" src="${escapeHtml(item.banner)}" alt="${escapeHtml(item.titulo)}" loading="lazy">` : ""}
        </div>
        ${!ehEvento ? `<div class="item-dia-semana ${ehHoje ? "hoje" : "normal"}">${ehHoje ? "HOJE" : diaSemana}</div>` : ""}
      </div>
    `;
  }).join("");
});

</script>

</body>
</html>
