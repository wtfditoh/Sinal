<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>SINAL — Cartazes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0B0D12">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <div class="topbar">
    <div class="brand">
      <button class="avatar-btn" id="topbarAvatar"></button>
      <div class="brand-name">SINAL</div>
    </div>
    <button class="icon-btn" id="logoutBtn" title="Sair">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>

  <main>
    <div class="month-nav">
      <div class="month-label">Cartazes</div>
    </div>

    <div class="summary-strip">
      <div class="summary-chip">
        <div class="summary-num" id="totalCartazes">0</div>
        <div class="summary-tag">no total</div>
      </div>
      <div class="summary-chip">
        <div class="summary-num red" id="totalAtrasados">0</div>
        <div class="summary-tag">atrasados</div>
      </div>
      <div class="summary-chip">
        <div class="summary-num green" id="totalPostadosCartaz">0</div>
        <div class="summary-tag">postados</div>
      </div>
    </div>

    <div id="listaCartazes">
      <div class="skeleton skeleton-cartaz"></div>
      <div class="skeleton skeleton-cartaz"></div>
      <div class="skeleton skeleton-cartaz"></div>
    </div>

    <div class="empty-state" id="emptyState" style="display:none;">
      <div><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
      <p>Nenhum cartaz cadastrado ainda.<br>Toca no + pra adicionar o primeiro.</p>
    </div>
  </main>

  <button class="fab-inner" id="addBtn" title="Novo cartaz"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <div class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="dashboard.html" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><path d="M9 12h6"/><path d="M9 16h6"/></svg> Culto
      </a>
      <a href="escala.html" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Escala
        <span class="notif-dot" id="dotEscala"></span>
      </a>
      <a href="cartazes.html" class="nav-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg> Cartazes
      </a>
      <button class="nav-item" id="btnMais">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg> Mais
      </button>
    </div>
  </div>

</div>

<!-- Modal: novo cartaz -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-title" id="cartazModalTitle">Novo cartaz</div>
    <form id="cartazForm">
      <div class="field">
        <label for="pTitulo">Título / descrição</label>
        <input type="text" id="pTitulo" placeholder="ex: Cartaz Culto de Jovens" required>
      </div>
     <div class="field">
  <label>Imagem do cartaz</label>
  <div class="upload-area" id="cartazUploadArea" style="border:2px dashed #2E3444; border-radius:12px; padding:30px 20px; text-align:center; cursor:pointer; background:#14171F;">
    <div style="font-size:36px; margin-bottom:8px;" id="cartazUploadIcone">🖼️</div>
    <div style="font-size:14px; color:#9CA3B5;" id="cartazUploadTexto">Clique para escolher o cartaz</div>
    <div style="font-size:12px; color:#5C6478;" id="cartazUploadHint">JPG ou PNG — máx 10MB</div>
    <input type="file" id="cartazFileInput" accept="image/*" style="display:none;">
    <div class="upload-preview" id="cartazPreview" style="display:none; margin-top:12px;">
      <img id="cartazPreviewImg" style="max-width:100%; max-height:200px; border-radius:8px;">
      <button type="button" id="cartazRemover" style="margin-top:8px; background:rgba(255,92,92,0.1); border:1px solid rgba(255,92,92,0.3); color:#FF5C5C; padding:6px 12px; border-radius:6px; cursor:pointer;">Remover imagem</button>
    </div>
  </div>
  <input type="hidden" id="pLink">
</div>
      <div class="field">
        <label for="pLembreteTexto">Lembrete</label>
        <input type="text" id="pLembreteTexto" placeholder="ex: Postar até sexta 18h">
      </div>
      <div class="field">
        <label for="pLembreteData">Data do lembrete</label>
        <input type="date" id="pLembreteData">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="cartazSubmitBtn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="cartazes.js"></script>
</body>
</html>
