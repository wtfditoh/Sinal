<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SINAL — Em manutenção</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0B0D12">
<link rel="stylesheet" href="style.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #08090D;
    font-family: 'Inter', sans-serif;
    color: #F5F6F8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background-image:
      radial-gradient(circle at 12% -5%, rgba(255, 176, 32, 0.10), transparent 42%),
      radial-gradient(circle at 88% 105%, rgba(52, 211, 153, 0.08), transparent 42%);
  }

  .manutencao-card {
    text-align: center;
    max-width: 400px;
    width: 100%;
    animation: aparecer 0.6s ease-out;
  }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-mark {
    margin: 0 auto 28px;
    animation: girar 8s linear infinite;
  }

  @keyframes girar {
    to { transform: rotate(360deg); }
  }

  .manutencao-titulo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .manutencao-titulo span {
    color: #FFB020;
  }

  .manutencao-texto {
    font-size: 15px;
    color: #9CA3B5;
    line-height: 1.7;
    margin-bottom: 28px;
  }

  .card-aviso {
    background: rgba(255,176,32,0.06);
    border: 1px solid rgba(255,176,32,0.2);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
  }

  .card-icone {
    font-size: 24px;
    flex-shrink: 0;
  }

  .card-titulo {
    font-weight: 700;
    font-size: 14px;
    color: #FFB020;
    margin-bottom: 2px;
  }

  .card-texto {
    font-size: 13px;
    color: #9CA3B5;
    line-height: 1.5;
  }

  .barra {
    height: 4px;
    background: #1B1F2A;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 28px;
    position: relative;
  }

  .barra-fill {
    position: absolute;
    height: 100%;
    width: 40%;
    border-radius: 99px;
    background: linear-gradient(90deg, #6D28D9, #FFB020, #2EE896);
    animation: deslizar 1.8s ease-in-out infinite;
  }

  @keyframes deslizar {
    0% { left: -40%; }
    100% { left: 100%; }
  }

  .btn-recarregar {
    background: linear-gradient(135deg, #FFC454, #FFB020);
    color: #17130A;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 20px -6px rgba(255,176,32,0.4);
    font-family: 'Inter', sans-serif;
  }

  .btn-recarregar:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px -6px rgba(255,176,32,0.55);
  }

  .btn-recarregar:active {
    transform: translateY(0);
  }

  .rodape {
    margin-top: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #2E3444;
  }
</style>
</head>
<body>

<div class="manutencao-card">

  <!-- Logo girando (mesma do login) -->
  <div class="login-mark"></div>

  <div class="manutencao-titulo">
    Voltamos<br>em <span>breve</span>
  </div>

  <p class="manutencao-texto">
    O SINAL está passando por uma<br>
    atualização para ficar ainda melhor. 🙏
  </p>

  <div class="card-aviso">
    <div class="card-icone">🔧</div>
    <div>
      <div class="card-titulo">Manutenção em andamento</div>
      <div class="card-texto">Nossa equipe está trabalhando.<br>Não vai demorar muito.</div>
    </div>
  </div>

  <div class="barra"><div class="barra-fill"></div></div>

  <button class="btn-recarregar" onclick="window.location.reload()">
    Tentar novamente
  </button>

  <div class="rodape">SINAL • Sistema de Mídia da Igreja</div>

</div>

</body>
</html>
