<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINAL — Em manutenção</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#08090D">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --amber: #FFB020;
  --green: #2EE896;
  --red: #FF5C5C;
  --purple: #6D28D9;
}

body {
  background: #08090D;
  color: #F5F6F8;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  background-image:
    radial-gradient(ellipse 60% 40% at 50% -10%, rgba(255,176,32,0.06), transparent),
    radial-gradient(ellipse 40% 30% at 80% 110%, rgba(46,232,150,0.04), transparent);
}

.conteudo {
  text-align: center;
  max-width: 420px;
  width: 100%;
  animation: aparecer 0.8s ease-out;
}

@keyframes aparecer {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Logo animada */
.logo-area {
  width: 100px;
  height: 100px;
  margin: 0 auto 32px;
  position: relative;
}

.anel {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: var(--amber);
  border-right-color: var(--green);
  border-bottom-color: var(--red);
  border-left-color: var(--purple);
  animation: girar 3s linear infinite;
}

@keyframes girar {
  to { transform: rotate(360deg); }
}

.logo-centro {
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  background: #0E1116;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
  overflow: hidden;
}

.logo-centro img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.logo-centro .logo-letra {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 40px;
  color: var(--amber);
}

/* Texto principal */
.titulo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 30px;
  letter-spacing: -0.5px;
  margin-bottom: 12px;
}

.titulo span {
  background: linear-gradient(90deg, var(--amber), #FFD875);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitulo {
  font-size: 15px;
  color: #9CA3B5;
  line-height: 1.7;
  margin-bottom: 32px;
}

/* Card de aviso */
.card-aviso {
  background: rgba(255,176,32,0.06);
  border: 1px solid rgba(255,176,32,0.2);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
}

.card-icone {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,176,32,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.card-icone svg {
  width: 20px;
  height: 20px;
  stroke: var(--amber);
}

.card-titulo {
  font-weight: 700;
  font-size: 14px;
  color: var(--amber);
  margin-bottom: 2px;
}

.card-texto {
  font-size: 13px;
  color: #9CA3B5;
  line-height: 1.5;
}

/* Barra de progresso suave */
.barra {
  height: 4px;
  background: #1B1F2A;
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 32px;
}

.barra-fill {
  height: 100%;
  width: 40%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--purple), var(--amber), var(--green));
  background-size: 200% 100%;
  animation: barra 2.5s ease-in-out infinite;
}

@keyframes barra {
  0% { width: 20%; background-position: 0% 0%; }
  50% { width: 75%; background-position: 100% 0%; }
  100% { width: 20%; background-position: 0% 0%; }
}

/* Botão */
.btn-recarregar {
  background: linear-gradient(135deg, #FFC454, var(--amber));
  color: #17130A;
  border: none;
  border-radius: 12px;
  padding: 14px 28px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 8px 20px -6px rgba(255,176,32,0.4);
}

.btn-recarregar:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 28px -6px rgba(255,176,32,0.55);
}

.btn-recarregar:active {
  transform: translateY(0);
}

.rodape {
  margin-top: 28px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #2E3444;
}
</style>
</head>
<body>

<div class="conteudo">
  <!-- Logo com anel giratório simples -->
  <div class="logo-area">
    <div class="anel"></div>
    <div class="logo-centro">
      <!-- Se quiser usar a imagem, troque a letra por <img src="icon-192.png"> -->
      <span class="logo-letra"><img src="icon-192.png" alt="SINAL"></span>
    </div>
  </div>

  <div class="titulo">Voltamos<br>em <span>breve</span></div>
  <p class="subtitulo">
    O SINAL está passando por uma<br>atualização para ficar ainda melhor. 🙏
  </p>

  <div class="card-aviso">
    <div class="card-icone">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <div>
      <div class="card-titulo">Manutenção em andamento</div>
      <div class="card-texto">Nossa equipe está trabalhando.<br>Não vai demorar muito.</div>
    </div>
  </div>

  <div class="barra"><div class="barra-fill"></div></div>

  <button class="btn-recarregar" onclick="window.location.reload()">
    Tentar novamente
  </button>

  <div class="rodape">SINAL • Sistema de Mídia da Igreja</div>
</div>

</body>
</html>
