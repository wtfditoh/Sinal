<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINAL — Gerador de Ícones</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #08090D;
    color: #F5F6F8;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    background-image:
      radial-gradient(circle at 12% -5%, rgba(255, 176, 32, 0.10), transparent 42%),
      radial-gradient(circle at 88% 105%, rgba(52, 211, 153, 0.08), transparent 42%);
  }

  .titulo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    text-align: center;
  }

  .subtitulo {
    font-size: 13px;
    color: #9CA3B5;
    text-align: center;
    max-width: 460px;
    line-height: 1.6;
    margin-top: -12px;
  }

  .canvas-wrap {
    padding: 20px;
    border-radius: 24px;
    background:
      linear-gradient(#14171F, #14171F) padding-box,
      linear-gradient(135deg, #2EE896, #FFB020, #FF5C5C) border-box;
    border: 2px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  canvas {
    width: 300px;
    height: 300px;
    display: block;
    border-radius: 20%;
  }

  .controles {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 500px;
  }

  .grupo {
    background: #14171F;
    border: 1px solid #2E3444;
    border-radius: 14px;
    padding: 14px 16px;
  }

  .grupo-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #5C6478;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .grupo-label span.valor {
    color: #FFB020;
    font-weight: 700;
  }

  .slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 4px;
    background: #2E3444;
    outline: none;
  }

  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFC454, #FFB020);
    cursor: pointer;
    border: 2px solid #08090D;
    box-shadow: 0 2px 8px rgba(255,176,32,0.5);
  }

  .slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFC454, #FFB020);
    cursor: pointer;
    border: 2px solid #08090D;
  }

  .botoes-grupo {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .opcao {
    flex: 1;
    min-width: 80px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #2E3444;
    background: #08090D;
    color: #9CA3B5;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .opcao:hover {
    border-color: #3a4152;
    color: #F5F6F8;
  }

  .opcao.ativo {
    border-color: #FFB020;
    background: rgba(255,176,32,0.08);
    color: #FFB020;
  }

  .btn-baixar {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #FFC454, #FFB020);
    color: #17130A;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 10px 24px -8px rgba(255, 176, 32, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
  }

  .btn-baixar:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 32px -8px rgba(255, 176, 32, 0.6);
  }

  .btn-baixar:active { transform: translateY(0); }

  .aviso {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: #5C6478;
    text-align: center;
    line-height: 1.7;
    max-width: 460px;
  }
</style>
</head>
<body>

  <div class="titulo">Gerador de Ícones SINAL</div>
  <p class="subtitulo">
    Escolhe o ângulo, tamanho e fundo. Baixa e já usa como ícone do app.
  </p>

  <div class="canvas-wrap">
    <canvas id="canvas" width="512" height="512"></canvas>
  </div>

  <div class="controles">

    <!-- Tamanho do anel -->
    <div class="grupo">
      <div class="grupo-label">
        <span>Tamanho do círculo</span>
        <span class="valor" id="escalaValor">70%</span>
      </div>
      <input type="range" min="30" max="95" value="70" class="slider" id="escalaSlider">
    </div>

    <!-- Rotação do gradiente -->
    <div class="grupo">
      <div class="grupo-label">
        <span>Rotação do gradiente</span>
        <span class="valor" id="anguloValor">0°</span>
      </div>
      <input type="range" min="0" max="360" value="0" class="slider" id="anguloSlider">
    </div>

    <!-- Tamanho -->
    <div class="grupo">
      <div class="grupo-label"><span>Resolução do arquivo</span></div>
      <div class="botoes-grupo">
        <button class="opcao" data-tam="192">192</button>
        <button class="opcao ativo" data-tam="512">512</button>
        <button class="opcao" data-tam="1024">1024</button>
      </div>
    </div>

    <!-- Estilo de fundo -->
    <div class="grupo">
      <div class="grupo-label"><span>Fundo</span></div>
      <div class="botoes-grupo">
        <button class="opcao ativo" data-fundo="solido">Escuro</button>
        <button class="opcao" data-fundo="gradiente">Degradê</button>
        <button class="opcao" data-fundo="transparente">Transparente</button>
      </div>
    </div>

    <button class="btn-baixar" id="btnBaixar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
      </svg>
      Baixar ícone
    </button>

  </div>

  <div class="aviso">
    💡 Cada ângulo parece um "frame" diferente da logo girando.<br>
    Pra ícone de app, usa 70% ou menos pra ficar com "respiro" nas bordas.
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const escalaSlider = document.getElementById('escalaSlider');
    const escalaValor = document.getElementById('escalaValor');
    const anguloSlider = document.getElementById('anguloSlider');
    const anguloValor = document.getElementById('anguloValor');
    const btnBaixar = document.getElementById('btnBaixar');

    let escala = 0.70;
    let angulo = 0;
    let tamanho = 512;
    let fundo = 'solido';

    const COR_VERDE = '#2EE896';
    const COR_AMBAR = '#FFB020';
    const COR_VERMELHO = '#FF5C5C';
    const COR_FUNDO = '#08090D';

      function desenhar() {
      const S = tamanho;
      canvas.width = S;
      canvas.height = S;

      const CX = S / 2;
      const CY = S / 2;
      const RAIO_EXTERNO = (S / 2) * escala;
      const RAIO_INTERNO = RAIO_EXTERNO * (2 / 3);

      ctx.clearRect(0, 0, S, S);
      ctx.globalCompositeOperation = 'source-over';

      // Função que desenha o fundo (sólido ou degradê)
      function desenharFundo() {
        if (fundo === 'solido') {
          ctx.fillStyle = COR_FUNDO;
          ctx.fillRect(0, 0, S, S);
        } else if (fundo === 'gradiente') {
          ctx.fillStyle = COR_FUNDO;
          ctx.fillRect(0, 0, S, S);

          // Radial laranja (topo-esquerda)
          const g1 = ctx.createRadialGradient(0, 0, 0, 0, 0, S * 0.9);
          g1.addColorStop(0, 'rgba(255, 176, 32, 0.22)');
          g1.addColorStop(1, 'rgba(255, 176, 32, 0)');
          ctx.fillStyle = g1;
          ctx.fillRect(0, 0, S, S);

          // Radial verde (base-direita)
          const g2 = ctx.createRadialGradient(S, S, 0, S, S, S * 0.9);
          g2.addColorStop(0, 'rgba(46, 232, 150, 0.16)');
          g2.addColorStop(1, 'rgba(46, 232, 150, 0)');
          ctx.fillStyle = g2;
          ctx.fillRect(0, 0, S, S);

          // Radial vermelho (topo-direita)
          const g3 = ctx.createRadialGradient(S, 0, 0, S, 0, S * 0.75);
          g3.addColorStop(0, 'rgba(255, 92, 92, 0.10)');
          g3.addColorStop(1, 'rgba(255, 92, 92, 0)');
          ctx.fillStyle = g3;
          ctx.fillRect(0, 0, S, S);
        }
      }

      // 1. Fundo base
      desenharFundo();

      // 2. Anel externo com gradiente cônico
      const rad = (angulo * Math.PI) / 180;
      const gradiente = ctx.createConicGradient(Math.PI + rad, CX, CY);
      gradiente.addColorStop(0, COR_VERDE);
      gradiente.addColorStop(1 / 3, COR_AMBAR);
      gradiente.addColorStop(2 / 3, COR_VERMELHO);
      gradiente.addColorStop(1, COR_VERDE);

      ctx.beginPath();
      ctx.arc(CX, CY, RAIO_EXTERNO, 0, Math.PI * 2);
      ctx.fillStyle = gradiente;
      ctx.fill();

      // 3. Miolo
      if (fundo === 'transparente') {
        // Fura de verdade (transparente)
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(CX, CY, RAIO_INTERNO, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      } else if (fundo === 'gradiente') {
        // Fura o miolo, depois redesenha o fundo só na área do miolo
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(CX, CY, RAIO_INTERNO, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';

        // Recorta pra desenhar só dentro do círculo interno
        ctx.save();
        ctx.beginPath();
        ctx.arc(CX, CY, RAIO_INTERNO, 0, Math.PI * 2);
        ctx.clip();
        desenharFundo();
        ctx.restore();
      } else {
        // Sólido: pinta o miolo com a cor de fundo
        ctx.beginPath();
        ctx.arc(CX, CY, RAIO_INTERNO, 0, Math.PI * 2);
        ctx.fillStyle = COR_FUNDO;
        ctx.fill();
      }
    }

    function baixar() {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sinal-icon-${tamanho}x${tamanho}-${fundo}-${angulo}deg.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    // Eventos
    escalaSlider.addEventListener('input', () => {
      escala = parseInt(escalaSlider.value, 10) / 100;
      escalaValor.textContent = escalaSlider.value + '%';
      desenhar();
    });

    anguloSlider.addEventListener('input', () => {
      angulo = parseInt(anguloSlider.value, 10);
      anguloValor.textContent = angulo + '°';
      desenhar();
    });

    document.querySelectorAll('[data-tam]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-tam]').forEach((b) => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        tamanho = parseInt(btn.dataset.tam, 10);
        desenhar();
      });
    });

    document.querySelectorAll('[data-fundo]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-fundo]').forEach((b) => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        fundo = btn.dataset.fundo;
        desenhar();
      });
    });

    btnBaixar.addEventListener('click', baixar);

    desenhar();
  </script>

</body>
</html>
