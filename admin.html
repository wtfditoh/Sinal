<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Notificações</title>

<style>

body{
    margin:0;
    min-height:100vh;
    background:#08090D;
    color:white;
    font-family:Inter,Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
}


.container{
    width:90%;
    max-width:450px;

    background:#14171F;
    border:1px solid #252a36;

    border-radius:20px;
    padding:25px;

    box-shadow:0 0 30px rgba(120,80,255,.15);
}


h1{
    margin-top:0;
    font-size:25px;
}


.sub{
    color:#9ca3af;
    font-size:14px;
    margin-bottom:20px;
}


input,
textarea{

    width:100%;
    box-sizing:border-box;

    background:#08090D;

    border:1px solid #303747;

    color:white;

    border-radius:12px;

    padding:14px;

    font-size:15px;

    outline:none;

}


textarea{

    height:130px;
    resize:none;

}


input:focus,
textarea:focus{

    border-color:#8b5cf6;

}



button{

    width:100%;

    margin-top:20px;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#8b5cf6;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


button:hover{

    opacity:.9;

}


</style>

</head>


<body>


<div class="container">


<h1>📢 Notificações</h1>


<div class="sub" id="usuario">
Carregando...
</div>



<input 
id="titulo"
placeholder="Título da notificação"
>


<br><br>


<textarea 
id="mensagem"
placeholder="Digite a mensagem..."
></textarea>



<button id="enviar">
Enviar notificação
</button>



</div>


<script type="module" src="./admin.js"></script>


</body>

</html>
